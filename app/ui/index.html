<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniTone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- いまの出力デバイスにまだ効かないとき、などの知らせ。パネルの上の端に重ねて出す。 -->
    <div id="notice" hidden>
      <span id="notice-text"></span>
      <button type="button" id="attach" hidden></button>
    </div>

    <!-- ツマミの絵は 4 つとも同じ部品を使う（アナログの表示）。目盛りと指針の位置は main.js が決める。 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="knob-body" cx="35%" cy="28%" r="80%">
          <stop offset="0" stop-color="#4a4d55" />
          <stop offset="1" stop-color="#16171a" />
        </radialGradient>
      </defs>
    </svg>

    <main>
      <!-- 電源の丸い押しボタン（直径 52 px）。ON のときは、周りのリングと電源のマークがオレンジに光る。
           その下に、ツマミを全部まんなかに戻す RESET のボタン。 -->
      <div class="control power">
        <button type="button" id="power" aria-pressed="false" aria-label="Power">
          <svg viewBox="-35 -35 70 70" aria-hidden="true">
            <circle r="33" fill="#0d0e10" />
            <circle class="ring" r="30" />
            <circle class="body" r="25" />
            <g class="mark">
              <path d="M0 -12v11" />
              <path d="M-7.5 -7.5a10.6 10.6 0 1 0 15 0" />
            </g>
          </svg>
        </button>
        <span class="label">POWER</span>
        <span class="value" id="power-label">OFF</span>
        <button type="button" id="reset" aria-label="Reset all knobs">RESET</button>
      </div>

      <div class="control">
        <div class="knob" id="bass" role="slider" tabindex="0" aria-label="Bass">
          <svg viewBox="-100 -100 200 200" aria-hidden="true">
            <path class="ticks" d="M -60.81 60.81 A 86 86 0 1 1 60.81 60.81" pathLength="100" stroke-dasharray="0.8 9.12" />
            <circle r="68" fill="#0d0e10" />
            <circle class="body" r="64" />
            <g class="pointer"><line x1="0" y1="-58" x2="0" y2="-30" /></g>
          </svg>
        </div>
        <span class="label">BASS</span>
        <span class="value" id="bass-value"></span>
      </div>

      <div class="control">
        <div class="knob" id="mid" role="slider" tabindex="0" aria-label="Mid">
          <svg viewBox="-100 -100 200 200" aria-hidden="true">
            <path class="ticks" d="M -60.81 60.81 A 86 86 0 1 1 60.81 60.81" pathLength="100" stroke-dasharray="0.8 9.12" />
            <circle r="68" fill="#0d0e10" />
            <circle class="body" r="64" />
            <g class="pointer"><line x1="0" y1="-58" x2="0" y2="-30" /></g>
          </svg>
        </div>
        <span class="label">MID</span>
        <span class="value" id="mid-value"></span>
      </div>

      <div class="control">
        <div class="knob" id="treble" role="slider" tabindex="0" aria-label="Treble">
          <svg viewBox="-100 -100 200 200" aria-hidden="true">
            <path class="ticks" d="M -60.81 60.81 A 86 86 0 1 1 60.81 60.81" pathLength="100" stroke-dasharray="0.8 9.12" />
            <circle r="68" fill="#0d0e10" />
            <circle class="body" r="64" />
            <g class="pointer"><line x1="0" y1="-58" x2="0" y2="-30" /></g>
          </svg>
        </div>
        <span class="label">TREBLE</span>
        <span class="value" id="treble-value"></span>
      </div>

      <div class="control">
        <div class="knob" id="volume" role="slider" tabindex="0" aria-label="Volume">
          <svg viewBox="-100 -100 200 200" aria-hidden="true">
            <path class="ticks" d="M -60.81 60.81 A 86 86 0 1 1 60.81 60.81" pathLength="100" stroke-dasharray="0.6 6.027" />
            <!-- 100% を超える範囲の印 -->
            <path class="over" d="M -66.47 66.47 A 94 94 0 1 1 66.47 66.47" pathLength="100" stroke-dasharray="0 66.67 33.33 100" />
            <circle r="68" fill="#0d0e10" />
            <circle class="body" r="64" />
            <g class="pointer"><line x1="0" y1="-58" x2="0" y2="-30" /></g>
          </svg>
        </div>
        <span class="label">VOLUME</span>
        <span class="value" id="volume-value"></span>
      </div>

      <!-- デジタルの表示。ツマミの代わりに、LED の並んだ横のバーを 4 行。LED と、まんなかの印は main.js が並べる。 -->
      <div id="bars">
        <div class="row">
          <span class="label">BASS</span>
          <div class="bar" id="bass-bar" role="slider" tabindex="0" aria-label="Bass"></div>
          <span class="num"><b id="bass-num"></b><i id="bass-unit"></i></span>
        </div>
        <div class="row">
          <span class="label">MID</span>
          <div class="bar" id="mid-bar" role="slider" tabindex="0" aria-label="Mid"></div>
          <span class="num"><b id="mid-num"></b><i id="mid-unit"></i></span>
        </div>
        <div class="row">
          <span class="label">TREBLE</span>
          <div class="bar" id="treble-bar" role="slider" tabindex="0" aria-label="Treble"></div>
          <span class="num"><b id="treble-num"></b><i id="treble-unit"></i></span>
        </div>
        <div class="row">
          <span class="label">VOLUME</span>
          <div class="bar" id="volume-bar" role="slider" tabindex="0" aria-label="Volume"></div>
          <span class="num"><b id="volume-num"></b><i id="volume-unit"></i></span>
        </div>
      </div>
    </main>

    <!-- 表示の切り替え。上がツマミ、下がバー。いまの表示のほうがオレンジに光る。 -->
    <div id="view">
      <button type="button" id="view-analog" aria-pressed="true" aria-label="Knob view" title="Knobs">
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="8" /><path d="M0 -1.5L4.2 -5.7" /></svg>
      </button>
      <button type="button" id="view-digital" aria-pressed="false" aria-label="Bar view" title="Bars">
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M-8 -6H1M-8 0H7M-8 6H-3" /></svg>
      </button>
    </div>

    <footer id="status"></footer>

    <script src="main.js"></script>
  </body>
</html>
